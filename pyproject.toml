[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "tools",      # standalone scripts, not part of the importable package
    "archive",    # retired code, kept verbatim — linting it would rewrite history
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs and design issues)
    "G",    # flake8-logging-format (enforce % formatting in log calls)
    "LOG",  # flake8-logging (logger hygiene)
]
ignore = [
    # E501 (line-too-long): 100 chars is a hard rule (BEST_PRACTICES.md, CLAUDE.md)
    # but not enforced here — 284 pre-existing violations as of 2026-10-17
    # (tests/test_geocoder.py 78, app.py 61, db.py 30). Keep new lines under 100.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixtures and helpers in ways that look unused to static analysis
"tests/*" = ["F841", "B"]
# conftest fixtures are injected by pytest, not called directly
"conftest.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
