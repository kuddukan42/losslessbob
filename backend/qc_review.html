<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Review Console</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --surface3: #22272e;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #2563eb;
      --accent-h: #1d4ed8;
      --success:  #16a34a;
      --warning:  #d97706;
      --danger:   #dc2626;
      --radius:   8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; height: 100vh; display: flex; flex-direction: column;
    }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; }
    .head-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { font-size: 1rem; font-weight: 600; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600;
      padding: 2px 9px; border-radius: 999px; background: rgba(37,99,235,.2);
      color: #93c5fd; border: 1px solid rgba(37,99,235,.4); white-space: nowrap;
    }
    .pill.readonly { background: rgba(217,119,6,.18); color: #fcd34d; border-color: rgba(217,119,6,.45); }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: .74rem; color: var(--muted); }
    .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
    .stats b.err { color: #fca5a5; }
    .stats b.warn { color: #fcd34d; }

    .tabs { display: flex; gap: 4px; margin-top: 8px; }
    .tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); padding: 6px 12px; font: inherit; font-size: .82rem;
      cursor: pointer; border-radius: 6px 6px 0 0;
    }
    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    .toolbar {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      padding: 8px 16px; background: var(--surface2); border-bottom: 1px solid var(--border);
    }
    select, input[type=text], input[type=search] {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; font: inherit; font-size: .8rem;
    }
    input[type=search] { min-width: 200px; }
    button {
      background: var(--surface3); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; font: inherit; font-size: .8rem; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--border); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover:not(:disabled) { background: var(--accent-h); }
    .chip {
      font-size: .74rem; padding: 3px 9px; border-radius: 999px; cursor: pointer;
      background: var(--surface3); border: 1px solid var(--border); color: var(--muted);
    }
    .chip.on { background: rgba(37,99,235,.25); border-color: rgba(37,99,235,.6); color: #bfdbfe; }
    .chip-group { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .chip-group .lab { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-right: 2px; }

    main { flex: 1; display: flex; min-height: 0; }
    #list-pane { width: 58%; overflow: auto; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    #grid-wrap { flex: 1; overflow: auto; }
    #detail-pane { flex: 1; overflow: auto; padding: 14px 16px 40px; }
    @media (max-width: 1100px) {
      main { flex-direction: column; }
      #list-pane { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--border); }
    }

    table.grid { width: 100%; border-collapse: collapse; font-size: .78rem; }
    table.grid th {
      position: sticky; top: 0; background: var(--surface2); text-align: left;
      padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 600;
      color: var(--muted); white-space: nowrap; z-index: 5;
    }
    table.grid td { padding: 5px 8px; border-bottom: 1px solid rgba(48,54,61,.5); vertical-align: top; }
    table.grid tr.row { cursor: pointer; }
    table.grid tr.row:hover { background: var(--surface2); }
    table.grid tr.row.focus { background: rgba(37,99,235,.16); box-shadow: inset 3px 0 0 var(--accent); }
    .nowrap { white-space: nowrap; }
    .dim { color: var(--muted); }
    .tag {
      display: inline-block; font-size: .66rem; font-weight: 600; padding: 1px 6px;
      border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
    }
    .tag.error { background: rgba(220,38,38,.18); color: #fca5a5; border-color: rgba(220,38,38,.45); }
    .tag.warn { background: rgba(217,119,6,.18); color: #fcd34d; border-color: rgba(217,119,6,.45); }
    .tag.info { background: var(--surface3); color: var(--muted); border-color: var(--border); }
    .tag.open { background: rgba(220,38,38,.14); color: #fca5a5; border-color: rgba(220,38,38,.35); }
    .tag.confirmed { background: rgba(217,119,6,.14); color: #fcd34d; border-color: rgba(217,119,6,.35); }
    .tag.false_positive, .tag.fixed { background: rgba(22,163,74,.14); color: #86efac; border-color: rgba(22,163,74,.35); }
    .tag.corrected { background: rgba(37,99,235,.14); color: #93c5fd; border-color: rgba(37,99,235,.35); }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; }
    .panel h3 {
      font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600;
    }
    .panel .body { padding: 10px 12px; }
    table.sources { width: 100%; border-collapse: collapse; font-size: .8rem; }
    table.sources td { padding: 6px 8px; border-bottom: 1px solid rgba(48,54,61,.6); vertical-align: top; }
    table.sources td:first-child { width: 150px; color: var(--muted); white-space: nowrap; }
    table.sources tr:last-child td { border-bottom: none; }
    pre.evidence {
      white-space: pre-wrap; word-break: break-word; font-size: .76rem; line-height: 1.5;
      max-height: 300px; overflow: auto; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .dates { display: flex; gap: 6px; flex-wrap: wrap; }
    .dates a {
      color: #93c5fd; text-decoration: none; font-size: .76rem; border: 1px solid rgba(37,99,235,.4);
      border-radius: 6px; padding: 2px 8px; background: rgba(37,99,235,.12);
    }
    .dates a:hover { background: rgba(37,99,235,.24); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .pager { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--border); font-size: .78rem; }
    .pager span { color: var(--muted); }

    /* Queue tab */
    #tab-queue { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 60px; }
    .queue-toolbar { width: 100%; max-width: 760px; display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .queue-progress { font-size: .76rem; color: var(--muted); margin-left: auto; }
    .card { width: 100%; max-width: 760px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-head .entity { font-weight: 600; }
    .card-head .first-seen { margin-left: auto; font-size: .74rem; color: var(--muted); }
    .card-body { padding: 12px 16px; }
    .why-flagged { font-size: .84rem; margin-bottom: 12px; }
    .why-flagged .rule-desc { color: var(--muted); }
    .decision-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); }
    .decision-row textarea {
      flex-basis: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px; font: inherit; font-size: .8rem; resize: vertical; min-height: 34px;
    }
    button.confirm { border-color: rgba(22,163,74,.5); }
    button.fp { border-color: rgba(37,99,235,.5); }
    button.danger-outline { border-color: rgba(220,38,38,.5); }
    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .7rem;
      background: var(--surface3); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    }
    .correction-form { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 10px 16px; border-top: 1px solid var(--border); }
    .correction-form[hidden] { display: none; }
    .correction-form input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: .8rem; }
    .correction-form .row2 { display: flex; gap: 8px; }
    .correction-form .row2 > * { flex: 1; }
    .flash {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
      background: var(--surface3); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; font-size: .82rem; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .flash.error { border-color: rgba(220,38,38,.6); color: #fca5a5; }
    .flash.ok { border-color: rgba(22,163,74,.6); color: #86efac; }
    .bulk-bar { display: flex; gap: 8px; align-items: center; padding: 6px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: .78rem; }
    .bulk-bar .n { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="head-row">
      <h1>QC Review Console</h1>
      <span class="pill" id="curator-pill">curator —</span>
      <div class="stats">
        <span>open errors <b class="err" id="stat-errors">–</b></span>
        <span>open warnings <b class="warn" id="stat-warnings">–</b></span>
        <span>last run <b id="stat-last-run">–</b></span>
      </div>
      <button id="run-rules-btn">Run rules</button>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="queue">Queue</button>
      <button class="tab" data-tab="findings">Findings</button>
    </div>
  </header>

  <div id="tab-queue"></div>

  <main id="tab-findings" style="display:none;">
    <div id="list-pane">
      <div class="bulk-bar" id="bulk-bar" style="display:none;">
        <span class="n" id="bulk-count">0 selected</span>
        <button id="bulk-confirm" class="confirm" disabled>Confirm selected</button>
        <button id="bulk-fp" class="fp" disabled>False positive selected</button>
        <span class="dim" id="bulk-hint"></span>
      </div>
      <div class="toolbar">
        <div class="chip-group" id="rule-chips"><span class="lab">rule</span></div>
      </div>
      <div class="toolbar">
        <div class="chip-group" id="severity-chips">
          <span class="lab">severity</span>
          <span class="chip" data-filter="severity" data-value="">any</span>
          <span class="chip" data-filter="severity" data-value="error">error</span>
          <span class="chip" data-filter="severity" data-value="warn">warn</span>
          <span class="chip" data-filter="severity" data-value="info">info</span>
        </div>
        <div class="chip-group" id="status-chips">
          <span class="lab">status</span>
          <span class="chip" data-filter="status" data-value="">any</span>
          <span class="chip" data-filter="status" data-value="open">open</span>
          <span class="chip" data-filter="status" data-value="confirmed">confirmed</span>
          <span class="chip" data-filter="status" data-value="false_positive">false_positive</span>
          <span class="chip" data-filter="status" data-value="corrected">corrected</span>
          <span class="chip" data-filter="status" data-value="fixed">fixed</span>
        </div>
      </div>
      <div class="toolbar">
        <input type="search" id="q-input" placeholder="search detail / entity key…">
        <button id="q-clear">Clear filters</button>
      </div>
      <div id="grid-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th></th>
              <th>Rule</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Entity</th>
              <th>Detail</th>
              <th>First seen</th>
              <th>Last seen</th>
              <th>Shows</th>
            </tr>
          </thead>
          <tbody id="grid-body"></tbody>
        </table>
      </div>
      <div class="pager">
        <button id="page-prev">&larr;</button>
        <span id="page-info">–</span>
        <button id="page-next">&rarr;</button>
      </div>
    </div>
    <div id="detail-pane"><div class="empty">Select a finding to see its evidence and context.</div></div>
  </main>

<script>
  const state = {
    tab: 'queue',
    filters: { rule: '', severity: '', status: '', entity_kind: '', q: '' },
    page: 1,
    page_size: 50,
    total: 0,
    rows: [],
    focusId: null,
    selected: new Map(),
    isCurator: null,
  };

  const queue = {
    ids: [],        // ordered finding ids, error-before-warn, then rule_id, then id
    idx: 0,
    ruleFilter: '',
    skipped: new Set(),
    current: null,  // loaded finding detail for queue.ids[idx]
  };

  async function getJSON(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error('request failed: ' + r.status);
    return r.json();
  }

  function flash(msg, kind) {
    const el = document.createElement('div');
    el.className = 'flash' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function flashError(status, body) {
    if (status === 403) {
      flash('Curator mode is off — enable it to make decisions here.', 'error');
    } else {
      flash((body && (body.message || body.error)) || ('request failed: ' + status), 'error');
    }
  }

  // ── curator flag ─────────────────────────────────────────────────────────

  async function loadCurator() {
    try {
      const s = await getJSON('/api/curator');
      state.isCurator = !!s.is_curator;
    } catch (e) {
      state.isCurator = false;
    }
    const pill = document.getElementById('curator-pill');
    pill.textContent = state.isCurator ? 'curator on' : 'curator off — read only';
    pill.classList.toggle('readonly', !state.isCurator);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // ── header / summary ────────────────────────────────────────────────────

  async function loadSummary() {
    try {
      const s = await getJSON('/api/qc/summary');
      document.getElementById('stat-errors').textContent = s.total_open_errors;
      document.getElementById('stat-warnings').textContent = s.total_open_warnings;
      document.getElementById('stat-last-run').textContent = s.last_run_at || 'never';
      renderRuleChips(s.rules);
    } catch (e) {
      console.error(e);
    }
  }

  function renderRuleChips(rules) {
    const box = document.getElementById('rule-chips');
    box.innerHTML = '<span class="lab">rule</span>';
    const any = document.createElement('span');
    any.className = 'chip' + (state.filters.rule === '' ? ' on' : '');
    any.textContent = 'any';
    any.onclick = () => setFilter('rule', '');
    box.appendChild(any);
    for (const ruleId of Object.keys(rules).sort()) {
      const chip = document.createElement('span');
      chip.className = 'chip' + (state.filters.rule === ruleId ? ' on' : '');
      chip.title = rules[ruleId].description;
      chip.textContent = ruleId;
      chip.onclick = () => setFilter('rule', ruleId);
      box.appendChild(chip);
    }
  }

  // ── filters / paging ────────────────────────────────────────────────────

  function setFilter(key, value) {
    state.filters[key] = value;
    state.page = 1;
    syncChips();
    loadFindings();
  }

  function syncChips() {
    document.querySelectorAll('.chip[data-filter]').forEach(chip => {
      const key = chip.dataset.filter;
      chip.classList.toggle('on', state.filters[key] === chip.dataset.value);
    });
    document.querySelectorAll('#rule-chips .chip').forEach(chip => {
      const isAny = chip.textContent === 'any';
      chip.classList.toggle('on', isAny ? state.filters.rule === '' : chip.textContent === state.filters.rule);
    });
  }

  document.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => setFilter(chip.dataset.filter, chip.dataset.value));
  });

  let qTimer = null;
  document.getElementById('q-input').addEventListener('input', e => {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => setFilter('q', v), 250);
  });

  document.getElementById('q-clear').addEventListener('click', () => {
    state.filters = { rule: '', severity: '', status: '', entity_kind: '', q: '' };
    document.getElementById('q-input').value = '';
    state.page = 1;
    syncChips();
    loadFindings();
  });

  document.getElementById('page-prev').addEventListener('click', () => {
    if (state.page > 1) { state.page--; loadFindings(); }
  });
  document.getElementById('page-next').addEventListener('click', () => {
    if (state.page * state.page_size < state.total) { state.page++; loadFindings(); }
  });

  // ── findings grid ───────────────────────────────────────────────────────

  async function loadFindings() {
    const params = new URLSearchParams();
    for (const [k, v] of Object.entries(state.filters)) if (v) params.set(k, v);
    params.set('page', state.page);
    params.set('page_size', state.page_size);
    try {
      const data = await getJSON('/api/qc/findings?' + params.toString());
      state.rows = data.rows;
      state.total = data.total;
      renderGrid();
      renderPager();
    } catch (e) {
      console.error(e);
    }
  }

  function renderGrid() {
    const body = document.getElementById('grid-body');
    if (!state.rows.length) {
      body.innerHTML = '<tr><td colspan="9" class="empty">No findings match these filters.</td></tr>';
      return;
    }
    body.innerHTML = state.rows.map(r => `
      <tr class="row${r.id === state.focusId ? ' focus' : ''}" data-id="${r.id}">
        <td><input type="checkbox" class="bulk-check" data-id="${r.id}" data-rule="${esc(r.rule_id)}"
          ${state.selected.has(r.id) ? 'checked' : ''}></td>
        <td class="mono nowrap">${esc(r.rule_id)}</td>
        <td><span class="tag ${esc(r.severity)}">${esc(r.severity)}</span></td>
        <td><span class="tag ${esc(r.status)}">${esc(r.status)}</span></td>
        <td class="nowrap">${esc(r.entity_kind)}:${esc(r.entity_key)}</td>
        <td>${esc(r.detail)}</td>
        <td class="nowrap dim">${esc(r.first_seen)}</td>
        <td class="nowrap dim">${esc(r.last_seen)}</td>
        <td class="nowrap">${r.shows_affected}</td>
      </tr>`).join('');
    body.querySelectorAll('tr.row').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.classList.contains('bulk-check')) return;
        selectFinding(Number(tr.dataset.id));
      });
    });
    body.querySelectorAll('.bulk-check').forEach(cb => {
      cb.addEventListener('change', () => {
        const id = Number(cb.dataset.id);
        if (cb.checked) state.selected.set(id, cb.dataset.rule);
        else state.selected.delete(id);
        renderBulkBar();
      });
    });
    renderBulkBar();
  }

  // ── bulk decisions ──────────────────────────────────────────────────────

  function renderBulkBar() {
    const bar = document.getElementById('bulk-bar');
    const n = state.selected.size;
    bar.style.display = n ? 'flex' : 'none';
    document.getElementById('bulk-count').textContent = `${n} selected`;
    const rules = new Set(state.selected.values());
    const oneRule = n > 0 && rules.size === 1;
    document.getElementById('bulk-confirm').disabled = !oneRule;
    document.getElementById('bulk-fp').disabled = !oneRule;
    document.getElementById('bulk-hint').textContent =
      n > 0 && !oneRule ? 'bulk actions need one rule per batch' : '';
  }

  async function bulkDecide(status) {
    const ids = [...state.selected.keys()];
    if (!ids.length) return;
    try {
      const r = await fetch('/api/qc/findings/bulk', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids, status }),
      });
      const body = await r.json();
      if (!r.ok) return flashError(r.status, body);
      flash(`${ids.length} finding(s) marked ${status}.`, 'ok');
      state.selected.clear();
      await loadSummary();
      await loadFindings();
    } catch (e) {
      flash('Bulk decision failed: ' + e.message, 'error');
    }
  }

  document.getElementById('bulk-confirm').addEventListener('click', () => bulkDecide('confirmed'));
  document.getElementById('bulk-fp').addEventListener('click', () => bulkDecide('false_positive'));

  function renderPager() {
    const start = state.total === 0 ? 0 : (state.page - 1) * state.page_size + 1;
    const end = Math.min(state.page * state.page_size, state.total);
    document.getElementById('page-info').textContent = `${start}–${end} of ${state.total}`;
    document.getElementById('page-prev').disabled = state.page <= 1;
    document.getElementById('page-next').disabled = state.page * state.page_size >= state.total;
  }

  // ── detail drawer ───────────────────────────────────────────────────────

  async function selectFinding(id) {
    state.focusId = id;
    renderGrid();
    const pane = document.getElementById('detail-pane');
    pane.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const f = await getJSON('/api/qc/findings/' + id);
      renderDetail(f);
    } catch (e) {
      pane.innerHTML = '<div class="empty">Could not load finding ' + esc(id) + '.</div>';
    }
  }

  function renderDetail(f) {
    const pane = document.getElementById('detail-pane');
    const dateLinks = (f.affected_dates || []).map(d =>
      `<a href="/api/dossier/html?date=${encodeURIComponent(d)}&inline=1" target="_blank" rel="noopener">${esc(d)}</a>`
    ).join('') || '<span class="dim">none resolved</span>';

    pane.innerHTML = `
      <div class="panel">
        <h3>${esc(f.rule_id)} · ${esc(f.severity)} · ${esc(f.status)}</h3>
        <div class="body">
          <table class="sources">
            <tr><td>Entity</td><td class="value">${esc(f.entity_kind)}:${esc(f.entity_key)}</td></tr>
            <tr><td>Rule description</td><td>${esc(f.rule_description || '')}</td></tr>
            <tr><td>Detail</td><td>${esc(f.detail)}</td></tr>
            <tr><td>First / last seen</td><td>${esc(f.first_seen)} &rarr; ${esc(f.last_seen)}</td></tr>
            <tr><td>Quarantined</td><td>${f.quarantined ? 'yes' : 'no'}</td></tr>
            ${f.decided_by ? `<tr><td>Decided</td><td>${esc(f.decided_by)} at ${esc(f.decided_at)}${f.note ? ' — ' + esc(f.note) : ''}</td></tr>` : ''}
          </table>
        </div>
      </div>

      <div class="panel">
        <h3>Evidence</h3>
        <div class="body"><pre class="evidence">${esc(JSON.stringify(f.evidence, null, 2))}</pre></div>
      </div>

      <div class="panel">
        <h3>Context (${esc(f.rule_id)} family)</h3>
        <div class="body"><pre class="evidence">${esc(JSON.stringify(f.context, null, 2))}</pre></div>
      </div>

      <div class="panel">
        <h3>Affected shows</h3>
        <div class="body dates">${dateLinks}</div>
      </div>
    `;
  }

  // ── tabs ────────────────────────────────────────────────────────────────

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isQueue = tab.dataset.tab === 'queue';
      state.tab = tab.dataset.tab;
      document.getElementById('tab-queue').style.display = isQueue ? 'flex' : 'none';
      document.getElementById('tab-findings').style.display = isQueue ? 'none' : 'flex';
      if (isQueue && !queue.ids.length) loadQueue();
      if (!isQueue && !state.rows.length) loadFindings();
    });
  });

  // ── run rules ────────────────────────────────────────────────────────────

  let runPollTimer = null;

  async function startRun() {
    const btn = document.getElementById('run-rules-btn');
    btn.disabled = true;
    btn.textContent = 'Running…';
    try {
      const r = await fetch('/api/qc/run', { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const body = await r.json();
      if (!r.ok) {
        flashError(r.status, body);
        btn.disabled = false;
        btn.textContent = 'Run rules';
        return;
      }
      pollRun();
    } catch (e) {
      flash('Could not start run: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Run rules';
    }
  }

  async function pollRun() {
    clearTimeout(runPollTimer);
    try {
      const s = await getJSON('/api/qc/run');
      const btn = document.getElementById('run-rules-btn');
      if (s.running) {
        btn.disabled = true;
        btn.textContent = `Running… (${s.done || 0}/${s.total || 0})`;
        runPollTimer = setTimeout(pollRun, 800);
        return;
      }
      btn.disabled = false;
      btn.textContent = 'Run rules';
      if (s.stage === 'done') {
        flash('Rules run finished.', 'ok');
        await loadSummary();
        queue.ids = []; queue.current = null;
        if (state.tab === 'queue') await loadQueue();
        else await loadFindings();
      } else if (s.stage === 'error') {
        flash('Rules run failed — see server logs.', 'error');
      }
    } catch (e) {
      console.error(e);
    }
  }

  document.getElementById('run-rules-btn').addEventListener('click', startRun);

  // ── queue tab ────────────────────────────────────────────────────────────

  const QUEUE_STORAGE_KEY = 'qc_queue_state_v1';

  function saveQueueState() {
    try {
      localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify({
        currentId: queue.ids[queue.idx] ?? null,
        skipped: [...queue.skipped],
      }));
    } catch (e) { /* ignore — private mode, quota, etc. */ }
  }

  function loadQueueState() {
    try {
      const raw = localStorage.getItem(QUEUE_STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  async function loadQueue() {
    const params = new URLSearchParams({ status: 'open', page_size: '200' });
    if (queue.ruleFilter) params.set('rule', queue.ruleFilter);
    let rows = [];
    try {
      let page = 1;
      while (true) {
        params.set('page', page);
        const data = await getJSON('/api/qc/findings?' + params.toString());
        rows = rows.concat(data.rows);
        if (!data.rows.length || rows.length >= data.total) break;
        page++;
      }
    } catch (e) {
      document.getElementById('tab-queue').innerHTML =
        '<div class="empty">Could not load the queue.</div>';
      return;
    }
    const sevRank = { error: 0, warn: 1, info: 2 };
    rows.sort((a, b) =>
      (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9)
      || a.rule_id.localeCompare(b.rule_id) || a.id - b.id);

    queue.ids = rows.map(r => r.id);
    queue.idx = 0;

    const saved = loadQueueState();
    if (saved) {
      queue.skipped = new Set(saved.skipped || []);
      if (saved.currentId != null) {
        const at = queue.ids.indexOf(saved.currentId);
        if (at >= 0) queue.idx = at;
      }
    }
    advanceToUnskipped(queue.idx);
    await renderQueueCard();
  }

  function advanceToUnskipped(fromIdx) {
    let i = fromIdx;
    while (i < queue.ids.length && queue.skipped.has(queue.ids[i])) i++;
    queue.idx = i;
  }

  async function renderQueueCard() {
    const root = document.getElementById('tab-queue');
    if (!queue.ids.length) {
      root.innerHTML = '<div class="empty">No open findings' +
        (queue.ruleFilter ? ` for ${esc(queue.ruleFilter)}` : '') + '. Nice.</div>';
      return;
    }
    if (queue.idx >= queue.ids.length) {
      root.innerHTML = '<div class="empty">Queue cleared for this session.</div>';
      return;
    }
    const id = queue.ids[queue.idx];
    root.innerHTML = `
      <div class="queue-toolbar">
        <select id="queue-rule-filter"></select>
        <span class="queue-progress">${queue.idx + 1} / ${queue.ids.length}
          (${queue.skipped.size} skipped) &nbsp;
          <kbd>c</kbd> confirm · <kbd>f</kbd> false positive · <kbd>e</kbd> correct ·
          <kbd>s</kbd> skip · <kbd>j</kbd>/<kbd>k</kbd> next/prev · <kbd>o</kbd> open source</span>
      </div>
      <div id="queue-card-wrap"><div class="empty">Loading…</div></div>
    `;
    populateQueueRuleFilter();
    saveQueueState();
    try {
      const f = await getJSON('/api/qc/findings/' + id);
      queue.current = f;
      renderQueueCardBody(f);
    } catch (e) {
      document.getElementById('queue-card-wrap').innerHTML =
        '<div class="empty">Could not load finding ' + esc(id) + '.</div>';
    }
  }

  function populateQueueRuleFilter() {
    const sel = document.getElementById('queue-rule-filter');
    if (!sel) return;
    const rules = [...new Set(queue.ids.map(id => (queue.current && queue.current.id === id)
      ? queue.current.rule_id : null).filter(Boolean))];
    // Rebuild from the summary rule set instead (stable across the queue).
    getJSON('/api/qc/summary').then(s => {
      const ids = Object.keys(s.rules).sort();
      sel.innerHTML = '<option value="">all rules</option>' +
        ids.map(r => `<option value="${esc(r)}"${r === queue.ruleFilter ? ' selected' : ''}>${esc(r)}</option>`).join('');
    }).catch(() => {});
    sel.onchange = () => {
      queue.ruleFilter = sel.value;
      queue.skipped.clear();
      loadQueue();
    };
  }

  function highlightMention(text, evidence) {
    if (!text) return '';
    const needle = evidence && (evidence.mention || evidence.matched_text);
    if (!needle) return esc(text);
    const idx = text.indexOf(needle);
    if (idx < 0) return esc(text);
    return esc(text.slice(0, idx)) + '<mark>' + esc(needle) + '</mark>' +
      esc(text.slice(idx + needle.length));
  }

  function renderQueueCardBody(f) {
    const wrap = document.getElementById('queue-card-wrap');
    const dateLinks = (f.affected_dates || []).map(d =>
      `<a href="/api/dossier/html?date=${encodeURIComponent(d)}&inline=1" target="_blank" rel="noopener">${esc(d)}</a>`
    ).join('') || '<span class="dim">none resolved</span>';

    wrap.innerHTML = `
      <div class="card">
        <div class="card-head">
          <span class="tag ${esc(f.severity)}">${esc(f.severity)}</span>
          <span class="mono">${esc(f.rule_id)}</span>
          <span class="entity">${esc(f.entity_kind)}:${esc(f.entity_key)}</span>
          <span class="dim">${(f.affected_dates || []).length} show(s)</span>
          <span class="first-seen">first seen ${esc(f.first_seen)}</span>
        </div>
        <div class="card-body">
          <div class="why-flagged">
            <div class="rule-desc">${esc(f.rule_description || '')}</div>
            <div>${esc(f.detail)}</div>
          </div>
          ${renderEvidencePanel(f)}
          <div class="panel">
            <h3>Affected shows</h3>
            <div class="body dates">${dateLinks}</div>
          </div>
        </div>
        <div class="decision-row">
          <button class="confirm" id="q-confirm">Confirm</button>
          <button class="fp" id="q-fp">False positive</button>
          <button id="q-correct">Correct…</button>
          <button id="q-skip">Skip</button>
          <textarea id="q-note" placeholder="note (optional)"></textarea>
        </div>
        <div class="correction-form" id="q-correction-form" hidden>
          <div class="row2">
            <input id="q-corr-field" placeholder="field" value="${esc(f.evidence && f.evidence.field || '')}">
            <input id="q-corr-original" placeholder="original"
              value="${esc(f.evidence && (f.evidence.original || f.evidence.value) || '')}">
          </div>
          <div class="row2">
            <input id="q-corr-corrected" placeholder="corrected value">
            <input id="q-corr-reason" placeholder="reason">
          </div>
          <div>
            <button class="confirm" id="q-corr-submit">Save correction</button>
            <button id="q-corr-cancel">Cancel</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('q-confirm').addEventListener('click', () => queueDecide('confirmed'));
    document.getElementById('q-fp').addEventListener('click', () => queueDecide('false_positive'));
    document.getElementById('q-skip').addEventListener('click', () => queueSkip());
    document.getElementById('q-correct').addEventListener('click', () => {
      document.getElementById('q-correction-form').hidden = false;
    });
    document.getElementById('q-corr-cancel').addEventListener('click', () => {
      document.getElementById('q-correction-form').hidden = true;
    });
    document.getElementById('q-corr-submit').addEventListener('click', queueSubmitCorrection);

    wireTaperActions(f);
  }

  function renderEvidencePanel(f) {
    const ctx = f.context || {};
    if (f.rule_id.startsWith('R-T')) {
      const attr = ctx.attribution || {};
      const entry = ctx.entry || {};
      const mentionHtml = highlightMention(entry.description, f.evidence);
      return `
        <div class="panel">
          <h3>Taper attribution</h3>
          <div class="body">
            <table class="sources">
              <tr><td>Attribution</td><td>${esc(attr.taper_normalised || '(none)')} · ${esc(attr.confidence || '')}</td></tr>
              <tr><td>Evidence text</td><td>${mentionHtml}</td></tr>
              <tr><td>TUIT tapers</td><td>${(ctx.tuit_tapers || []).map(t => esc(t.taper)).join(', ') || '(none)'}</td></tr>
            </table>
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button id="q-reject-attribution" class="danger-outline">Reject attribution</button>
              <a class="pill" style="text-decoration:none"
                href="/taper-review#tab=entries&q=${encodeURIComponent(f.entity_key)}"
                target="_blank" rel="noopener">Open in /taper-review</a>
            </div>
          </div>
        </div>`;
    }
    if (f.rule_id.startsWith('R-O')) {
      return `
        <div class="panel">
          <h3>Olof setlist</h3>
          <div class="body">
            <pre class="evidence">${esc(ctx.raw_text || '')}</pre>
            <table class="sources">
              ${(ctx.parsed_songs || []).map(s =>
                `<tr><td>${s.position}</td><td>${esc(s.song_title)} ${esc(s.annotations || '')}</td></tr>`
              ).join('')}
            </table>
          </div>
        </div>`;
    }
    if (f.rule_id === 'R-G1') {
      const g = ctx.venue_geocoded || {};
      return `
        <div class="panel">
          <h3>Geocode</h3>
          <div class="body">
            <table class="sources">
              <tr><td>Venue</td><td>${esc(g.venue || f.entity_key)} · ${esc(g.city || '')}</td></tr>
              <tr><td>Geocoder match</td><td>${esc(g.note || f.evidence?.note || '')}</td></tr>
              <tr><td>Missing tokens</td><td>${esc((f.evidence?.missing || []).join(', '))}</td></tr>
              <tr><td>Confidence</td><td>${esc(g.confidence ?? '')} · ${esc(g.source || '')}</td></tr>
            </table>
          </div>
        </div>`;
    }
    if (f.rule_id === 'R-E1') {
      const e = ctx.entry || {};
      return `
        <div class="panel"><h3>Entry</h3>
          <div class="body"><pre class="evidence">${esc(JSON.stringify(e, null, 2))}</pre></div>
        </div>`;
    }
    if (f.rule_id === 'R-F1') {
      return `
        <div class="panel"><h3>Family</h3>
          <div class="body"><pre class="evidence">${esc(JSON.stringify(ctx, null, 2))}</pre></div>
        </div>`;
    }
    // R-S1 and anything else: raw context/evidence dump.
    return `
      <div class="panel"><h3>Evidence</h3>
        <div class="body"><pre class="evidence">${esc(JSON.stringify(f.evidence, null, 2))}</pre></div>
      </div>`;
  }

  function wireTaperActions(f) {
    const btn = document.getElementById('q-reject-attribution');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const lb = f.entity_key;
      try {
        const r = await fetch(`/api/tapers/attributions/${encodeURIComponent(lb)}/reject`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
        });
        const body = await r.json();
        if (!r.ok) return flashError(r.status, body);
        flash(`LB-${lb} attribution rejected. Run rules to clear the finding.`, 'ok');
      } catch (e) {
        flash('Reject failed: ' + e.message, 'error');
      }
    });
  }

  async function queueDecide(status) {
    if (!queue.current) return;
    const id = queue.current.id;
    const note = document.getElementById('q-note').value || null;
    try {
      const r = await fetch(`/api/qc/findings/${id}/decision`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status, note }),
      });
      const body = await r.json();
      if (!r.ok) return flashError(r.status, body);
      flash(`Finding ${id} marked ${status}.`, 'ok');
      queueNext();
    } catch (e) {
      flash('Decision failed: ' + e.message, 'error');
    }
  }

  async function queueSubmitCorrection() {
    if (!queue.current) return;
    const field = document.getElementById('q-corr-field').value.trim();
    const original = document.getElementById('q-corr-original').value || null;
    const corrected = document.getElementById('q-corr-corrected').value.trim();
    const reason = document.getElementById('q-corr-reason').value || null;
    if (!field || !corrected) return flash('field and corrected value are required', 'error');
    try {
      const r = await fetch('/api/qc/corrections', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ finding_id: queue.current.id, field, corrected, reason, original }),
      });
      const body = await r.json();
      if (!r.ok) return flashError(r.status, body);
      flash('Correction saved.', 'ok');
      queueNext();
    } catch (e) {
      flash('Correction failed: ' + e.message, 'error');
    }
  }

  function queueSkip() {
    if (!queue.current) return;
    queue.skipped.add(queue.current.id);
    queueNext();
  }

  function queueNext() {
    advanceToUnskipped(queue.idx + 1);
    if (queue.idx < queue.ids.length && queue.ids[queue.idx] !== queue.current?.id) {
      saveQueueState();
      renderQueueCard();
      return;
    }
    // Nothing left ahead that isn't skipped/current — reload from the server
    // (a decision usually removes the finding from the open set entirely).
    loadQueue();
  }

  function queuePrev() {
    if (queue.idx > 0) {
      queue.idx--;
      saveQueueState();
      renderQueueCard();
    }
  }

  document.addEventListener('keydown', (e) => {
    if (state.tab !== 'queue') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    switch (e.key) {
      case 'c': queueDecide('confirmed'); break;
      case 'f': queueDecide('false_positive'); break;
      case 'e': {
        const form = document.getElementById('q-correction-form');
        if (form) form.hidden = !form.hidden;
        break;
      }
      case 's': queueSkip(); break;
      case 'j': queueNext(); break;
      case 'k': queuePrev(); break;
      case 'o': {
        const link = document.querySelector('#queue-card-wrap .dates a');
        if (link) window.open(link.href, '_blank', 'noopener');
        break;
      }
      default: return;
    }
    e.preventDefault();
  });

  // ── init ────────────────────────────────────────────────────────────────

  async function init() {
    await loadCurator();
    await loadSummary();
    await loadQueue();
  }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
