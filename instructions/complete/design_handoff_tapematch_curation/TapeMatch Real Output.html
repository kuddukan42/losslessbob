<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapeMatch — Design Answers on Real Output</title>
<meta name="omelette-owns-print" content="report.md">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tm.css">
<style>
.rdLeft{flex:0 0 430px;min-width:0;max-width:430px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--bg)}
.rdLeftBody{flex:1;overflow-y:auto;padding:2px 18px 26px;min-width:0;min-height:0}
.rdLeftBody .rpTable{table-layout:fixed}
.rdLeftBody .rpTable td{overflow:hidden;text-overflow:ellipsis}
.rdRight{flex:1 1 auto;min-width:0;padding:14px;display:flex;min-height:0}
.rdSheet{width:100%;height:100%;flex:1 1 auto;min-width:0}
/* the §11 document needs the width — below 1240px the two panes stack and each scrolls */
@media (max-width:1240px){
  .tmBody{flex-direction:column;overflow-y:auto}
  .rdLeft{flex:0 0 auto;max-width:none;border-right:none;border-bottom:1px solid var(--border)}
  .rdLeftBody{overflow:visible}
  .rdRight{flex:0 0 auto;height:min(860px,88vh)}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tm-data.js"></script>
<script src="tm-real.js"></script>
<script src="tm-realparse.js"></script>
<script type="text/babel" src="tm-parts.jsx"></script>
<script type="text/babel" src="tm-report.jsx"></script>
<script type="text/babel" src="tm-realdemo.jsx"></script>
</body>
</html>
